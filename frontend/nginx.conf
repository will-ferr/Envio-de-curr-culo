map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format main_json escape=json
    '{"time":"$time_iso8601","request_id":"$req_id","method":"$request_method","uri":"$uri",'
    '"status":$status,"duration_s":$request_time,"upstream_s":"$upstream_response_time"}';

upstream api {
    server ${API_UPSTREAM};
    keepalive 8;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    access_log /dev/stdout main_json;
    error_log  /dev/stderr warn;

    # Importação de currículo em PDF (limite da API: 10 MB).
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Geração de documentos e importação podem levar mais tempo.
        proxy_read_timeout 120s;
        # A API envia os próprios headers de segurança (inclusive a CSP da pré-visualização).
        add_header X-Served-By "candidaturas-web" always;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
