[project]
name = "candidaturas"
version = "0.1.0"
description = "Assistente self-hosted de candidaturas: perfil, análise de vagas, currículos adaptados por IA e funil."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "python-multipart>=0.0.9",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "jinja2>=3.1",
  "playwright>=1.47",
  "anthropic>=1.0",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "feedparser>=6.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: testes que exigem PostgreSQL real (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008", "SIM108", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
