<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>{{ subject }}</title>
<style>
  @page { size: A4; margin: 22mm 22mm; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 10.5pt; color: #222; line-height: 1.55; margin: 0; }
  .from { color: #555; font-size: 9pt; margin-bottom: 18px; }
  .from b { color: #1F5C99; font-size: 12pt; display: block; }
  p { margin: 0 0 10px; text-align: justify; }
  .closing { white-space: pre-line; margin-top: 18px; }
</style>
</head>
<body>
<div class="from"><b>{{ contact.name }}</b>{{ contact.email }}{% if contact.phone %} · {{ contact.phone }}{% endif %}{% if contact.location %} · {{ contact.location }}{% endif %}</div>
<p>{{ greeting }}</p>
{% for p in paragraphs %}<p>{{ p }}</p>{% endfor %}
<div class="closing">{{ closing }}</div>
</body>
</html>
