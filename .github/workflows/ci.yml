name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, migrations e testes (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cand
          POSTGRES_PASSWORD: cand
          POSTGRES_DB: cand
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cand" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-0123456789abcdef0123456789abcdef0123456789
      DATABASE_URL: postgresql+psycopg://cand:cand@127.0.0.1:5432/cand
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - name: Migrations (upgrade → downgrade → upgrade, sem divergência dos modelos)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Testes (SQLite)
        run: pytest -q -p no:logging --cov=app --cov-report=term
        env:
          DATABASE_URL: sqlite://
      - name: Testes (PostgreSQL, inclui concorrência da fila)
        run: pytest -q -p no:logging
        env:
          TEST_DATABASE_URL: postgresql+psycopg://cand:cand@127.0.0.1:5432/cand

  frontend:
    name: Frontend · lint, tipos, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    name: Docker · build das imagens
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Valida docker-compose
        run: SECRET_KEY=x POSTGRES_PASSWORD=y docker compose config -q
